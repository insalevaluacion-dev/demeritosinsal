services:
  - type: web
    name: demeritos-insl
    runtime: node
    rootDir: demeritos
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SCHEMA
        value: demeritos
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
